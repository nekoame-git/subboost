name: Docker Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/docker-build.yml"
      - "local/**"
      - "package-lock.json"
      - "package.json"
      - "packages/**"
      - "scripts/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.meta.outputs.build_version }}
      image_name: ${{ steps.meta.outputs.image_name }}
      release_version: ${{ steps.meta.outputs.release_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tag_suffix: ${{ steps.meta.outputs.tag_suffix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::12}"
          image_name="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected_tag="v${release_version}"
            if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${release_version}" >&2
              exit 1
            fi
            tag_suffix="${GITHUB_REF_NAME}"
            build_version="${release_version}+sha.${short_sha}"
          else
            tag_suffix="latest"
            build_version="${release_version}+sha.${short_sha}"
          fi

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${tag_suffix}" >> "$GITHUB_OUTPUT"

  build-image:
    runs-on: ${{ matrix.runner }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.platform }} image by digest
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: local/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_RELEASE_VERSION=${{ needs.meta.outputs.release_version }}
            APP_BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.meta.outputs.build_version }}
            APP_VERSION_TOKEN=${{ needs.meta.outputs.build_version }}
          cache-from: type=gha,scope=docker-build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-build-${{ matrix.arch }}
          provenance: false
          tags: ${{ needs.meta.outputs.image_name }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build_image.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    runs-on: ubuntu-latest
    needs:
      - meta
      - build-image
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Create multi-platform image tags
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
          RELEASE_VERSION: ${{ needs.meta.outputs.release_version }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
          TAG_SUFFIX: ${{ needs.meta.outputs.tag_suffix }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -type f | sort)
          if [ "${#digest_files[@]}" -lt 2 ]; then
            echo "Expected at least two architecture digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          sources=()
          for file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "$file")")
          done

          tags=(
            --tag "${IMAGE_NAME}:sha-${SHORT_SHA}"
          )

          if [ "${TAG_SUFFIX}" = "latest" ]; then
            tags+=(--tag "${IMAGE_NAME}:latest")
          else
            tags+=(
              --tag "${IMAGE_NAME}:${TAG_SUFFIX}"
              --tag "${IMAGE_NAME}:${RELEASE_VERSION}"
              --tag "${IMAGE_NAME}:latest"
            )
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

          echo "## Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sha | \`${IMAGE_NAME}:sha-${SHORT_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TAG_SUFFIX}" = "latest" ]; then
            echo "| latest | \`${IMAGE_NAME}:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| release | \`${IMAGE_NAME}:${TAG_SUFFIX}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| version | \`${IMAGE_NAME}:${RELEASE_VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| latest | \`${IMAGE_NAME}:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
